let history=[],attached=null,busy=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function md(s){let x=esc(s).replace(/```([\s\S]*?)```/g,(_,c)=>"<pre><code>"+c.trim()+"</code></pre>");x=x.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");return x.replace(/\n/g,"<br>")}
function scroll(){requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(history.slice(-50)))}catch(e){}}
function add(role,text,temp=false){let row=document.createElement("div");row.className="msg "+(role==="user"?"user":"ai");let im=document.createElement("img");im.className="mini";im.src=PHOTO;let b=document.createElement("div");b.className="box";b.innerHTML='<div class="label">'+(role==="user"?"You":"GLITCH AI")+'</div><div class="bubble">'+md(text)+'</div>';if(role==="assistant"&&!temp){let t=document.createElement("div");t.className="tools";let c=document.createElement("button");c.className="small";c.textContent="📋 कॉपी";c.onclick=()=>navigator.clipboard?.writeText(text);let s=document.createElement("button");s.className="small";s.textContent="🔊 सुनें";s.onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=/[\u0900-\u097F]/.test(text)?"hi-IN":"en-IN";speechSynthesis.speak(u)};t.append(c,s);b.append(t)}if(role==="user")row.append(b,im);else row.append(im,b);chat.append(row);scroll();return row}
function welcome(){chat.innerHTML='<div class="welcome"><img class="big"><h2>GLITCH AI</h2><p>नमस्ते! Hindi/Hinglish में पढ़ाई, Maths, Science, Coding और सामान्य सवाल पूछिए।</p><div class="quick"><button data-q="मुझे अपने बारे में बताओ">GLITCH AI</button><button data-q="भारत के बारे में 5 रोचक बातें बताओ">भारत</button><button data-q="2 + 2 कितना होता है?">Maths</button><button data-q="HTML क्या है?">Coding</button></div></div>';chat.querySelector(".big").src=PHOTO;chat.querySelectorAll(".quick button").forEach(x=>x.onclick=()=>{prompt.value=x.dataset.q;send()})}
function typing(){let r=add("assistant","",true);r.querySelector(".bubble").innerHTML='<div class="typing"><i></i><i></i><i></i></div>';return r}
async function check(){if(location.protocol==="file:"){status.textContent="http://localhost:3000 से खोलें";status.className="status bad";return}try{let r=await fetch(HEALTH,{cache:"no-store"}),d=await r.json();if(!d.ok)throw 0;status.textContent="● GLITCH AI server connected";status.className="status ok"}catch(e){status.textContent="● Server connected नहीं है";status.className="status bad"}}
function readFile(f){return new Promise((ok,no)=>{if(f.size>12*1024*1024)return no(new Error("File 12 MB से बड़ी है"));let r=new FileReader();r.onload=()=>{let s=String(r.result),i=s.indexOf(",");ok({mime_type:f.type||"application/octet-stream",data:i<0?s:s.slice(i+1)})};r.onerror=()=>no(new Error("File read error"));r.readAsDataURL(f)})}
async function send(){if(busy)return;let text=prompt.value.trim();if(!text&&!attached)return;busy=true;sendBtn.disabled=true;let f=attached;add("user",text||(f?"📎 "+f.name:""));history.push({role:"user",text:text||(f?"📎 "+f.name:"")});save();prompt.value="";prompt.style.height="43px";attached=null;pill.style.display="none";let wait=typing();try{let body={message:text||"इस फ़ाइल को समझाओ।",history:history.slice(-20)};if(f)body.file=await readFile(f);let r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||"HTTP "+r.status);let ans=String(d.answer||"").trim();if(!ans)throw new Error("Empty answer");wait.remove();add("assistant",ans);history.push({role:"assistant",text:ans});save();status.textContent="● GLITCH AI ready";status.className="status ok"}catch(e){wait.remove();add("assistant","माफ़ कीजिए, अभी server से जवाब नहीं मिला। Server और API key check करके फिर कोशिश करें।");status.textContent="● "+e.message;status.className="status bad"}finally{busy=false;sendBtn.disabled=false;prompt.focus()}}
$("attach").onclick=()=>file.click();file.onchange=()=>{let f=file.files[0];if(f){attached=f;pill.textContent="📎 "+f.name;pill.style.display="block"}};sendBtn.onclick=send;prompt.addEventListener("input",()=>{prompt.style.height="43px";prompt.style.height=Math.min(prompt.scrollHeight,130)+"px"});prompt.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});$("new").onclick=()=>{history=[];save();welcome()};$("clear").onclick=()=>{history=[];save();welcome()};
try{history=JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){history=[]}if(history.length){history.forEach(x=>add(x.role,x.text))}else welcome();check();
</script></body></html>
