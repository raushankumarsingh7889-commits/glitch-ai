<script>

/* ==========================================================
   GLITCH AI CONFIGURATION
========================================================== */

/*
   IMPORTANT:

   Agar frontend aur backend alag-alag hain,
   yahan apne Render backend ka URL lagao.

   Example:

   const SERVER =
   "https://glitch-ai-xxxx.onrender.com";

   Agar frontend same server par hai,
   SERVER ko "" rehne do.
*/

const SERVER = "YOUR-RENDER-URL";


/* API ENDPOINTS */

const API =

    ? SERVER.replace(/\/+$/, "") + "/api/chat"
    : "/api/chat";

const HEALTH =
    SERVER
    ? SERVER.replace(/\/+$/, "") + "/api/health"

/* LOCAL STORAGE */

const STORE =
    "glitch_rgb_history";

"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`

width="300"

rx="70"

<circle
cx="150"
cy="150"
r="100"

<text
x="150"

/* ==========================================================
   VARIABLES

let history = [];

let attached = null;

let busy = false;


/* ==========================================================
   ESCAPE HTML
========================================================== */

function esc(text){

    return String(text)
        .replace(
            /[&<>"']/g,
            function(char){

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#39;"

                }[char];

            }
        );

}


/* ==========================================================
   SIMPLE MARKDOWN
========================================================== */

function md(text){

    let x = esc(text);


    /*
       Code blocks
    */

    x = x.replace(
        /```([\s\S]*?)```/g,
        function(_, code){

            return (
                "<pre><code>" +
                code.trim() +
                "</code></pre>"
            );

        }
    );


    /*
       Bold
    */

    x = x.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
    );


    /*
       Inline code
    */

    x = x.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
    );


    /*
       New lines
    */

    return x.replace(
        /\n/g,
        "<br>"
    );

}

   SAVE HISTORY
========================================================== */

function save(){

/* ==========================================================
   ADD MESSAGE
========================================================== */

function add(
    role,
    text,
    temp=false
){

    const row =
        document.createElement("div");

    row.className =
        "msg " +
        (
            role === "user"
            ? "user"
            : "ai"
        );


    const image =
        document.createElement("img");

    image.className =
        "mini";

    image.src =
        PHOTO;

    image.alt =
        "GLITCH";


    const box =
        document.createElement("div");

    box.className =
        "box";


    const label =
        document.createElement("div");

    label.className =
        "label";

    label.textContent =
        role === "user"
        ? "You"
        : "GLITCH AI";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.innerHTML =
        md(text);


    box.appendChild(label);

    box.appendChild(bubble);


    /*
       Assistant tools
    */

    if(
        role === "assistant" &&
        !temp
    ){

        const tools =
            document.createElement("div");

        tools.className =
            "tools";


        /* COPY */

        const copy =
            document.createElement("button");

        copy.className =
            "small";

        copy.textContent =
            "📋 कॉपी";

        copy.onclick =
            async function(){

                try{

                    await navigator.clipboard
                        .writeText(text);

                    copy.textContent =
                        "✅ Copied";

                    setTimeout(
                        function(){

                            copy.textContent =
                                "📋 कॉपी";

                        },
                        1500
                    );

                }catch(error){

                    alert(
                        "Copy नहीं हो पाया।"
                    );

                }

            };


        /* SPEAK */

        const speak =
            document.createElement("button");

        speak.className =
            "small";

        speak.textContent =
            "🔊 सुनें";

        speak.onclick =
            function(){

                if(
                    !("speechSynthesis"
                    in window)
                ){

                    alert(
                        "आपके browser में voice support नहीं है।"
                    );

                    return;

                }

                speechSynthesis.cancel();

                const voice =
                    new SpeechSynthesisUtterance(
                        text
                    );

                voice.lang =
                    /[\u0900-\u097F]/.test(text)
                    ? "hi-IN"
                    : "en-IN";

                speechSynthesis.speak(
                    voice
                );

            };


        tools.appendChild(copy);

        tools.appendChild(speak);

        box.appendChild(tools);

    }


    if(role === "user"){

        row.appendChild(box);

        row.appendChild(image);

    }else{

        row.appendChild(image);

        row.appendChild(box);

    }


    chat.appendChild(row);

    scroll();

    return row;

}

/* ==========================================================
   CHECK SERVER
========================================================== */

async function check(){

    /*
       File directly open करने पर
       fetch API काम नहीं करेगा।
    */

    if(
        location.protocol === "file:"
    ){

        status.textContent =
            "Browser में server URL से खोलें";

        status.className =
            "status bad";

        return;

    }


    try{

        const response =
            await fetch(
                HEALTH,
                {
                    cache:"no-store"
                }
            );


        let data = {};

        try{

            data =
                await response.json();

        }catch(error){

            data = {};

        }


        if(!response.ok){

            throw new Error(
                "Server HTTP " +
                response.status
            );

        }


        if(
            data.ok === false
        ){

            throw new Error(
                "Health check failed"
            );

        }


        status.textContent =
            "● GLITCH AI server connected";

        status.className =
            "status ok";


    }catch(error){

        console.error(
            "Health check:",
            error
        );


        status.textContent =
            "● Server connected नहीं है";

        status.className =
            "status bad";

    }

}


/* ==========================================================
   READ FILE
========================================================== */

function readFile(f){

    return new Promise(
        function(resolve,reject){

            /*
               Maximum 12 MB
            */

            if(
                f.size >
                12 * 1024 * 1024
            ){

                reject(
                    new Error(
                        "File 12 MB से बड़ी है"
                    )
                );

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function(){

                    const result =
                        String(
                            reader.result
                        );


                    const index =
                        result.indexOf(",");


                    resolve({

                        mime_type:
                            f.type ||
                            "application/octet-stream",

                        data:
                            index < 0
                            ? result
                            : result.slice(
                                index + 1
                              )

                    });

                };


            reader.onerror =
                function(){

                    reject(
                        new Error(
                            "File read error"
                        )
                    );

                };


            reader.readAsDataURL(f);

        }
    );

}


/* ==========================================================
   SEND MESSAGE
========================================================== */

async function send(){

    /*
       Double sending रोकना
    */

    if(busy){

        return;

    }


    const text =
        prompt.value.trim();


    /*
       Empty message और
       no attachment
    */

    if(
        !text &&
        !attached
    ){

        return;

    }


    busy = true;

    sendBtn.disabled = true;


    const selectedFile =
        attached;


    /*
       User message दिखाओ
    */

    add(
        "user",
        text ||
        (
            selectedFile
            ? "📎 " + selectedFile.name
            : ""
        )
    );


    /*
       History
    */

    history.push({

        role:"user",

        text:
            text ||
            (
                selectedFile
                ? "📎 " + selectedFile.name
                : ""
            )

    });


    save();


    /*
       Input clear
    */

    prompt.value = "";

    prompt.style.height =
        "43px";


    attached = null;

    pill.style.display =
        "none";


    /*
       Typing
    */

    const wait =
        typing();


    try{

        /*
           Request body
        */

        const body = {

            message:
                text ||
                "इस फ़ाइल को समझाओ।",

            history:
                history.slice(-20)

        };


        /*
           File attach
        */

        if(selectedFile){

            body.file =
                await readFile(
                    selectedFile
                );

        }


        /*
           API request
        */

        const response =
            await fetch(
                API,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)

                }
            );


        /*
           JSON response
        */

        let data = {};

        try{

            data =
                await response.json();

        }catch(error){

            data = {};

        }


        /*
           HTTP error
        */

        if(
            !response.ok
        ){

            throw new Error(
                data.error ||
                "HTTP " +
                response.status
            );

        }


        /*
           Answer
        */

        const answer =
            String(
                data.answer || ""
            ).trim();


        if(!answer){

            throw new Error(
                "Server ने empty answer दिया"
            );

        }


        /*
           Remove typing
        */

        wait.remove();


        /*
           AI answer
        */

        add(
            "assistant",
            answer
        );


        /*
           History
        */

        history.push({

            role:"assistant",

            text:answer

        });


        save();


        /*
           Status
        */

        status.textContent =
            "● GLITCH AI ready";

        status.className =
            "status ok";


    }catch(error){

        console.error(
            "Chat error:",
            error
        );


        wait.remove();


        add(
            "assistant",
            "माफ़ कीजिए, अभी server से जवाब नहीं मिला। " +
            "Render backend और API key check करके फिर कोशिश करें।"
        );


        status.textContent =
            "● " +
            error.message;

        status.className =
            "status bad";

    }finally{

        busy = false;

        sendBtn.disabled =
            false;

        prompt.focus();

    }

}

);

            )
        ){

        );
